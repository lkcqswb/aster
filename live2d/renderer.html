<!doctype html><meta charset="utf-8"><title>Aster private renderer</title>
<style>html,body{margin:0;background:#111318;overflow:hidden}canvas{display:block}</style>
<canvas id="portrait"></canvas>
<script src="vendor/pixi.min.js"></script><script src="vendor/live2dcubismcore.min.js"></script><script src="vendor/pixi-live2d-display-cubism4.min.js"></script>
<script>
'use strict';
window.asterReady=false;window.asterError='';window.asterStage='initializing';
window.asterLoading={requested:0,loaded:0,rig:false,textures:[],warnings:[]};
const asterWarn=message=>{const list=window.asterLoading.warnings;if(list.length<24)list.push(String(message&&message.message||message).slice(0,240))};
// Before she is ready a failure stops startup; afterwards (an optional motion or expression) it is only recorded.
window.addEventListener('error',event=>{const m=event.message||'Renderer resource failed';if(window.asterReady)asterWarn(m);else window.asterError=m;});
window.addEventListener('unhandledrejection',event=>{const m=String(event.reason&&event.reason.message||event.reason||'Renderer promise failed');if(window.asterReady)asterWarn(m);else window.asterError=m;});
(async()=>{
 const REF_W=420,REF_H=620,MIN_SIDE=160,MAX_SIDE=1400;
 let W=REF_W,H=REF_H;
 const canvas=document.getElementById('portrait');
 const app=new PIXI.Application({view:canvas,width:W,height:H,backgroundColor:0x111318,antialias:true,preserveDrawingBuffer:true,autoStart:false});
 window.asterStage='reading renderer settings';
 const settings=await fetch('settings.json').then(r=>{if(!r.ok)throw Error('Renderer settings unavailable');return r.json()});
 const textureLimit=Math.max(512,Math.min(4096,settings.texture_size||2048));
 const originalFromURL=PIXI.Texture.fromURL.bind(PIXI.Texture);
 PIXI.Texture.fromURL=async (url,options)=>{
  window.asterLoading.requested++;
  const texture=await originalFromURL(url,options);
  const source=texture.baseTexture.resource.source;
  const width=texture.baseTexture.width,height=texture.baseTexture.height;
  const ratio=Math.min(1,textureLimit/Math.max(width,height));
  let rendered=texture;
  if(ratio<1){
   try{
    const reduced=document.createElement('canvas');reduced.width=Math.round(width*ratio);reduced.height=Math.round(height*ratio);
    const context=reduced.getContext('2d');context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';
    context.drawImage(source,0,0,reduced.width,reduced.height);
    rendered=PIXI.Texture.from(reduced);
   }catch(error){window.asterLoading.warnings.push(String(error));rendered=texture;}
   if(rendered!==texture){try{texture.destroy(true)}catch(error){window.asterLoading.warnings.push(String(error))}}
  }
  window.asterLoading.textures.push({file:String(url).split('/').pop(),original:[width,height],rendered:[rendered.baseTexture.width,rendered.baseTexture.height]});
  window.asterLoading.loaded++;
  return rendered;
 };
 window.asterStage='reading model definition';
 const modelUrl='model/'+encodeURIComponent('弄玉.model3.json');
 const definition=await fetch(modelUrl).then(r=>{if(!r.ok)throw Error('Model definition unavailable');return r.json()});
 const references=definition.FileReferences||{};
 window.asterStage='loading model and textures';
 let model;
 await new Promise((resolve,reject)=>{
  model=PIXI.live2d.Live2DModel.fromSync(modelUrl,{autoInteract:false,autoUpdate:false,onLoad:resolve,onError:reject});
  model.on('modelLoaded',()=>{window.asterLoading.rig=true});
 });
 window.asterStage='positioning model';
 app.stage.addChild(model);

 // ---- Framing --------------------------------------------------------------------------------
 // The tuned default: a 420x620 canvas, 2.70x the full-body fit, with the face anchor (19% down the
 // model) at 44% of the canvas height. Taller panes show more of her (up to about half the body);
 // wider or shorter panes stay a bust. The top of her hair keeps the same headroom throughout.
 model.scale.set(1);model.position.set(0,0);
 const measured=model.getBounds();
 const raw={x:measured.x,y:measured.y,width:measured.width,height:measured.height};
 const FACE=.19,FACE_Y=.44,ZOOM=2.70,REF_ASPECT=REF_W/REF_H;
 const refFraction=REF_H/(Math.min(REF_W/raw.width,REF_H/raw.height)*ZOOM*raw.height);
 const headroom=FACE-FACE_Y*refFraction;
 let framing={},framingChanged=true;
 const frameModel=()=>{
  const aspect=W/H;
  const fraction=aspect<REF_ASPECT
   ?Math.min(Math.max(refFraction,.55),refFraction*REF_ASPECT/aspect)
   :Math.max(refFraction*.8,refFraction*Math.pow(REF_ASPECT/aspect,.3));
  const scale=H/(fraction*raw.height);
  const anchor=Math.min(.5,Math.max(.28,(FACE-headroom)/fraction));
  model.scale.set(scale);
  model.x=W/2-scale*(raw.x+raw.width/2);
  model.y=H*anchor-scale*(raw.y+raw.height*FACE);
  framing={width:W,height:H,visible_fraction:Math.round(fraction*1000)/1000,face_at:Math.round(anchor*1000)/1000};
 };
 const resize=(width,height)=>{
  const w=Math.round(Math.min(MAX_SIDE,Math.max(MIN_SIDE,Number(width)||W)));
  const h=Math.round(Math.min(MAX_SIDE,Math.max(MIN_SIDE,Number(height)||H)));
  if(w===W&&h===H)return;
  W=w;H=h;app.renderer.resize(W,H);frameModel();framingChanged=true;
 };
 frameModel();

 // ---- Parameters -----------------------------------------------------------------------------
 const internal=model.internalModel,core=internal.coreModel;
 const call=(name,...args)=>{try{return typeof core[name]==='function'?core[name](...args):undefined}catch(_){return undefined}};
 let parameterIds=null;
 try{const m=core.getModel&&core.getModel();if(m&&m.parameters&&m.parameters.ids)parameterIds=Array.from(m.parameters.ids)}catch(_){}
 const parameterCount=Number(call('getParameterCount'))||(parameterIds?parameterIds.length:Infinity);
 // The Cubism framework hands out an index even for ids the rig lacks, so bound it by the real count.
 const indexOf=id=>{if(parameterIds)return parameterIds.indexOf(id);const i=call('getParameterIndex',id);return typeof i==='number'&&i>=0&&i<parameterCount?i:-1};
 const has=id=>indexOf(id)>=0;
 const group=name=>(((definition.Groups||[]).find(g=>g&&g.Name===name&&g.Target==='Parameter')||{}).Ids||[]).filter(has);
 const number=(v,fallback)=>typeof v==='number'&&isFinite(v)?v:fallback;
 const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
 const rnd=(a,b)=>a+Math.random()*(b-a);
 const round3=v=>Math.round(v*1000)/1000;
 const smooth=x=>x*x*(3-2*x);
 const warned=new Set();
 const warnOnce=message=>{if(!warned.has(message)){warned.add(message);asterWarn(message)}};

 // ---- Rig discovery ----------------------------------------------------------------------------
 // Display names and groups come from the model's DisplayInfo (cdi3.json); ranges from the core.
 window.asterStage='reading display names';
 const assetUrl=path=>'model/'+String(path).split('/').map(encodeURIComponent).join('/');
 const displayNames=new Map(),displayGroups=new Map();
 if(typeof references.DisplayInfo==='string'){
  try{
   const cdi=await fetch(assetUrl(references.DisplayInfo)).then(r=>r.ok?r.json():null);
   const groupNames=new Map(((cdi&&cdi.ParameterGroups)||[]).map(g=>[g&&g.Id,String(g&&(g.Name||g.Id)||'')]));
   for(const p of (cdi&&cdi.Parameters)||[]){
    if(p&&typeof p.Id==='string'){displayNames.set(p.Id,String(p.Name||''));displayGroups.set(p.Id,groupNames.get(p.GroupId)||String(p.GroupId||''))}
   }
  }catch(e){asterWarn(e)}
 }
 const describe=id=>{
  const i=indexOf(id);if(i<0)return null;
  const min=number(call('getParameterMinimumValue',i),0),max=number(call('getParameterMaximumValue',i),1);
  return {id,i,name:displayNames.get(id)||'',group:displayGroups.get(id)||'',min,max,def:number(call('getParameterDefaultValue',i),clamp(0,min,max))};
 };
 const rigParams=(parameterIds||[...displayNames.keys()].filter(has)).map(describe).filter(Boolean);
 const byId=new Map(rigParams.map(p=>[p.id,p]));
 // This rig's mouth-form/brow deformers are asymmetric. Keep their neutral values: never drive them.
 const PROTECTED=p=>/brow/i.test(p.id)||/mouth_?form/i.test(p.id)||/眉|嘴型/.test(p.name);
 // Words of an id or display name: camelCase, digits and punctuation split, lower case.
 const words=s=>String(s||'').replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/([A-Z]+)([A-Z][a-z])/g,'$1 $2')
  .replace(/([A-Za-z])([0-9])/g,'$1 $2').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
 const LATIN=/^[a-z0-9]+$/;
 // A Latin keyword matches a whole word, its plural, or (5+ letters) a longer word it begins.
 // Other keywords (Chinese, Japanese, symbols) match anywhere in the text.
 const matches=(text,keywords,except=[])=>{
  const s=String(text||'');if(!s||except.some(x=>s.includes(x)))return false;
  const tokens=words(s),lower=s.toLowerCase();
  return keywords.some(k=>LATIN.test(k)?tokens.some(t=>t===k||t===k+'s'||t===k+'es'||(k.length>=5&&t.startsWith(k))):lower.includes(k));
 };
 const matchParam=(p,keywords,except)=>matches(p.id.replace(/^Param/,''),keywords,except)||matches(p.name,keywords,except);
 const nameMatch=(names,keywords)=>{for(const k of keywords){const n=names.find(name=>matches(name,[k]));if(n)return n}return null};

 // ---- Procedural parameters --------------------------------------------------------------------
 // mode add: final = base + (ours - default), so an artist motion underneath blends instead of fighting.
 // mode mul: eyelids multiply, so a motion or expression that narrows her eyes still blinks.
 const SPEC={
  ParamAngleX:['add',-30,30,0],ParamAngleY:['add',-30,30,0],ParamAngleZ:['add',-30,30,0],
  ParamBodyAngleX:['add',-10,10,0],ParamBodyAngleZ:['add',-10,10,0],
  ParamEyeBallX:['add',-1,1,0],ParamEyeBallY:['add',-1,1,0],ParamEyeLOpen:['mul',0,1,1],ParamEyeROpen:['mul',0,1,1],
  ParamBreath:['add',0,1,0],ParamMouthOpenY:['add',0,1,0],ParamEyeLSmile:['add',0,1,0],ParamEyeRSmile:['add',0,1,0],
 };
 const eyeIds=['ParamEyeLOpen','ParamEyeROpen'].filter(has);if(!eyeIds.length)eyeIds.push(...group('EyeBlink'));
 const mouthIds=['ParamMouthOpenY'].filter(has);if(!mouthIds.length)mouthIds.push(...group('LipSync'));
 const procedural=new Set([...Object.keys(SPEC),...eyeIds,...mouthIds]);
 const driven=[],missing=[];
 const register=(id,spec)=>{
  const known=driven.find(p=>p.id===id);if(known)return known;
  const p=byId.get(id)||describe(id);
  if(!p){missing.push(id);return null}
  if(PROTECTED(p))return null;
  const d={id,i:p.i,mode:spec[0],min:number(p.min,spec[1]),max:number(p.max,spec[2]),def:number(p.def,spec[3]),out:0};
  d.out=d.def;driven.push(d);return d;
 };
 for(const [id,spec] of Object.entries(SPEC))register(id,spec);
 for(const id of eyeIds)register(id,['mul',0,1,1]);
 for(const id of mouthIds)register(id,['add',0,1,0]);

 // ---- Emotion toggles and arms, found by keyword -----------------------------------------------
 const CATEGORY_WORDS={
  blush:{words:['blush','cheek','flush','脸红','红晕','腮红','害羞','红脸','羞红','赤面','照れ']},
  tear:{words:['tear','teer','teardrop','cry','crying','weep','weeping','泪','哭','涙']},
  heart:{words:['heart','love','爱心','心','ハート'],except:['中心','重心','比心','心情']},
  star:{words:['star','sparkle','twinkle','glitter','星','闪闪','キラ']},
  angry:{words:['angry','anger','mad','rage','生气','怒','黑脸','青筋']},
  sweat:{words:['sweat','汗']},
  surprise:{words:['surprise','shock','shocked','惊','びっくり']},
  question:{words:['question','doubt','问号','疑','？','?']},
  dizzy:{words:['dizzy','spiral','swirl','晕','圈圈','眩','ぐるぐる']},
  smile:{words:['smile','smiling','happy','joy','笑','眯','开心']},
  pout:{words:['pout','嘟嘴','嘟','撅嘴']},
  tongue:{words:['tongue','吐舌','舌']},
  sleepy:{words:['sleepy','sleep','tired','drowsy','zzz','困','睡','眠']},
  shadow:{words:['shadow','gloom','阴影','阴暗','黑线']},
 };
 const EMOTIONS=['neutral','happy','laugh','shy','love','excited','surprised','confused','thinking','sad','cry','angry','pout','embarrassed','sleepy','proud','worried','dizzy'];
 const EMOTION_TOGGLES={
  neutral:{},happy:{smile:.6},laugh:{smile:1,blush:.5},shy:{blush:1},love:{heart:1,blush:.7},
  excited:{star:1,smile:.6,blush:.4},surprised:{surprise:1},confused:{question:1,sweat:.5},thinking:{},
  sad:{tear:.5,shadow:.7},cry:{tear:1,shadow:.4},angry:{angry:1,shadow:.5},pout:{pout:1,blush:.5},
  embarrassed:{blush:1,sweat:.8,tongue:.8},sleepy:{sleepy:1},proud:{star:.6,smile:.5},worried:{sweat:1,shadow:.4},
  dizzy:{dizzy:1,sweat:.5},
 };
 // Earlier tuning for this rig, kept alongside whatever the keywords find.
 const KNOWN_TOGGLES={ParamHeartEye:{love:1},ParamTeers3:{love:1,angry:1},ParamTeers2:{angry:1,cry:1,sad:.6},ParamTeers5:{angry:1,cry:1}};
 // Expression and motion group names for each emotion.
 const EMOTION_WORDS={
  neutral:['neutral','normal','default','普通','默认','正常','通常'],
  happy:['happy','joy','smile','开心','高兴','喜','笑'],laugh:['laugh','laughing','大笑','哈哈','爆笑'],
  shy:['shy','blush','害羞','羞','脸红'],love:['love','heart','爱','心'],excited:['excited','excite','兴奋','激动','星星'],
  surprised:['surprise','surprised','shock','惊','吃惊'],confused:['confuse','confused','question','困惑','疑','问号'],
  thinking:['think','thinking','ponder','思考'],sad:['sad','sorrow','难过','伤心','悲','哀'],
  cry:['cry','crying','tear','tears','哭','泪'],angry:['angry','anger','mad','生气','怒'],pout:['pout','嘟嘴','撅嘴','嘟'],
  embarrassed:['embarrass','embarrassed','awkward','尴尬','汗'],sleepy:['sleep','sleepy','tired','困','睡'],
  proud:['proud','smug','得意','骄傲'],worried:['worry','worried','anxious','担心','忧','焦虑'],dizzy:['dizzy','晕','眩'],
 };
 const ARM_WORDS=['arm','hand','elbow','wrist','手','臂','胳膊','肘','腕','挥','比心','托腮'];
 const ROLE_WORDS=[['chin',['chin','托腮','腮','下巴']],['heart',['heart','比心','爱心']],['cover',['cover','捂','遮']],
  ['wave',['wave','waving','挥','摆手','招手']],['raise',['raise','lift','up','抬','举']]];
 const sideOf=p=>{
  if(/左/.test(p.name))return 'L';if(/右/.test(p.name))return 'R';
  const m=p.id.match(/(Left|Right)|(?:Arm|Hand|Elbow|Wrist)_?(L|R)(?![a-z])|(?:^|_)(L|R)(?:_|$)/);
  return m?(m[1]||m[2]||m[3])[0]:'';
 };
 const arms=[],categories={};
 for(const p of rigParams){
  if(PROTECTED(p)||procedural.has(p.id))continue;
  if(matchParam(p,ARM_WORDS)){
   const role=(ROLE_WORDS.find(([,k])=>matchParam(p,k))||['arm'])[0];
   arms.push({id:p.id,side:sideOf(p),role,p});continue;
  }
  for(const [category,{words:keywords,except}] of Object.entries(CATEGORY_WORDS)){
   // A smile toggle on the mouth would be a mouth-form shape; leave those alone.
   if(category==='smile'&&(/mouth/i.test(p.id)||/嘴|口/.test(p.name)))continue;
   if(matchParam(p,keywords,except))(categories[category]=categories[category]||[]).push(p.id);
  }
 }
 const expressions=(references.Expressions||[]).map((e,index)=>({name:String(e&&(e.Name||e.File)||index),index}));
 const expressionNames=expressions.map(e=>e.name);
 const motionDefs=references.Motions||{};
 const motionGroups=Object.keys(motionDefs).filter(g=>Array.isArray(motionDefs[g])&&motionDefs[g].length);
 const findGroup=(...patterns)=>{for(const re of patterns){const g=motionGroups.find(name=>re.test(name));if(g)return g}return null};
 const idleGroup=findGroup(/^idle/i,/idle/i),tapGroup=findGroup(/^tap/i,/tap/i);
 const toggleValue=(p,weight)=>round3(p.def+(p.max-p.def)*weight);
 const rig={
  parameters:rigParams.map(p=>({id:p.id,name:p.name,group:p.group,min:round3(p.min),max:round3(p.max),default:round3(p.def)})),
  expressions:expressionNames,motions:Object.fromEntries(motionGroups.map(g=>[g,motionDefs[g].length])),
  protected:rigParams.filter(PROTECTED).map(p=>p.id),categories,arms:arms.map(({id,side,role})=>({id,side,role})),
  emotions:{},gestures:{},
 };
 for(const emotion of EMOTIONS){
  const weights=new Map();
  for(const [category,w] of Object.entries(EMOTION_TOGGLES[emotion]))for(const id of categories[category]||[])weights.set(id,Math.max(weights.get(id)||0,w));
  for(const [id,map] of Object.entries(KNOWN_TOGGLES)){
   const p=byId.get(id);
   if(map[emotion]&&p&&!PROTECTED(p)&&!procedural.has(id))weights.set(id,Math.max(weights.get(id)||0,map[emotion]));
  }
  rig.emotions[emotion]={params:[...weights].map(([id,w])=>({id,value:toggleValue(byId.get(id),w)})),
   expression:nameMatch(expressionNames,EMOTION_WORDS[emotion]),motion:nameMatch(motionGroups,EMOTION_WORDS[emotion])};
 }
 // Gestures: a motion group by name, else arm/hand parameters, else a head and body version.
 const GESTURES=['wave','nod','shake','tilt','think','cheer','heart','cover','stretch','look_around','fidget','bow'];
 const GESTURE_WORDS={
  wave:['wave','waving','hello','hi','bye','挥手','招手','打招呼','再见'],nod:['nod','nodding','点头'],
  shake:['shake','摇头'],tilt:['tilt','歪头','侧头'],think:['think','thinking','ponder','思考','托腮'],
  cheer:['cheer','hooray','yay','celebrate','欢呼','加油','庆祝'],heart:['heart','比心','爱心'],
  cover:['cover','捂嘴','捂脸','遮脸'],stretch:['stretch','伸懒腰','懒腰','伸展'],
  look_around:['lookaround','look','around','张望','环顾'],fidget:['fidget','小动作','晃'],bow:['bow','鞠躬','行礼','致意'],
 };
 const armFor=(role,side)=>arms.find(a=>a.role===role&&a.side===side)||arms.find(a=>a.role===role);
 const upperArm=side=>arms.find(a=>a.role==='arm'&&(!side||a.side===side)&&matchParam(a.p,['arm','臂','胳膊']));
 const lift=(p,f)=>round3(p.def+(p.max-p.def)*f);
 const swing=p=>p.def>p.min+1e-6?[round3(p.def-(p.def-p.min)*.7),round3(p.def+(p.max-p.def)*.7)]:[lift(p,.3),lift(p,1)];
 const holdAll=role=>arms.filter(a=>a.role===role).slice(0,2).map(a=>({id:a.id,value:lift(a.p,1)}));
 const ARM_PLANS={
  wave:()=>{
   const w=armFor('wave','R'),side=w?w.side||'R':'R',r=armFor('raise',side)||upperArm(side)||upperArm('');
   const out=[];
   if(r)out.push(w?{id:r.id,value:lift(r.p,.9)}:{id:r.id,values:[lift(r.p,.7),lift(r.p,1)]});
   if(w)out.push({id:w.id,values:swing(w.p)});
   return out;
  },
  cheer:()=>{let list=arms.filter(a=>a.role==='raise');if(!list.length)list=['L','R'].map(upperArm).filter(Boolean);return list.slice(0,2).map(a=>({id:a.id,values:[lift(a.p,.85),lift(a.p,1)]}))},
  think:()=>{const c=armFor('chin','R');return c?[{id:c.id,value:lift(c.p,1)}]:[]},
  heart:()=>holdAll('heart'),cover:()=>holdAll('cover'),stretch:()=>holdAll('raise'),
 };
 for(const gesture of GESTURES){
  const motion=nameMatch(motionGroups.filter(g=>g!==idleGroup&&g!==tapGroup),GESTURE_WORDS[gesture]);
  const params=motion?[]:(ARM_PLANS[gesture]?ARM_PLANS[gesture]():[]);
  rig.gestures[gesture]={params,motion,kind:motion?'motion':params.length?'params':'procedural'};
 }
 // User overrides (aster-nongyu.json), validated by Aster, merged over what was found.
 const overrides=settings.emotion_map&&typeof settings.emotion_map==='object'?settings.emotion_map:{};
 const exactName=(list,name)=>list.find(n=>n.toLowerCase()===String(name).toLowerCase())||null;
 for(const kind of ['emotions','gestures']){
  for(const [name,o] of Object.entries(overrides[kind]||{})){
   const where=`nongyu.json ${kind}.${name}`;
   const entry=rig[kind][name]||(rig[kind][name]=kind==='emotions'?{params:[],expression:null,motion:null}:{params:[],motion:null,kind:'procedural'});
   for(const [id,v] of Object.entries(o.params||{})){
    entry.params=entry.params.filter(x=>x.id!==id);
    if(v===null)continue;
    const p=byId.get(id);
    if(!p){warnOnce(`${where}: the rig has no ${id}`);continue}
    if(PROTECTED(p)){warnOnce(`${where}: ${id} is protected and never driven`);continue}
    if(procedural.has(id)){warnOnce(`${where}: ${id} follows her procedural motion and cannot be overridden`);continue}
    entry.params.push(Array.isArray(v)?{id,values:v.map(n=>round3(clamp(n,p.min,p.max)))}:{id,value:round3(clamp(v,p.min,p.max))});
   }
   for(const field of ['expression','motion']){
    if(!(field in o)||(field==='expression'&&kind!=='emotions'))continue;
    if(o[field]===null){entry[field]=null;continue}
    const found=exactName(field==='expression'?expressionNames:motionGroups,o[field]);
    if(found)entry[field]=found;else warnOnce(`${where}: the model has no ${field} ${o[field]}`);
   }
   if(kind==='gestures')entry.kind=entry.motion?'motion':entry.params.length?'params':(GESTURES.includes(name)?'procedural':'none');
   entry.override=true;
  }
 }
 // Every parameter an emotion or gesture may use joins the layer; at rest it adds nothing.
 const toggles=new Map();
 const addToggle=(id,w)=>{if(toggles.has(id))return;const d=register(id,['add',0,1,0]);if(d)toggles.set(id,{d,s:new Spring(d.def,w)})};

 // ---- Layer application ------------------------------------------------------------------------
 const write=(p,v)=>call('setParameterValueByIndex',p.i,Math.min(p.max,Math.max(p.min,v)));
 const read=p=>number(call('getParameterValueByIndex',p.i),p.def);
 const resetLayer=()=>{for(const p of driven)write(p,p.def)};
 const applyLayer=()=>{for(const p of driven){const base=read(p);write(p,p.mode==='mul'?base*p.out:base+p.out-p.def)}};
 const drives=id=>driven.some(p=>p.id===id);
 // Our own blink and breathing replace the SDK's fixed-rhythm versions of the same parameters.
 const quiet={updateParameters(){}};
 if(internal.eyeBlink&&eyeIds.some(drives))internal.eyeBlink=quiet;
