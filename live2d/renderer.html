<!doctype html><meta charset="utf-8"><title>Aster private renderer</title>
<style>html,body{margin:0;background:#111318;overflow:hidden}canvas{display:block}</style>
<canvas id="portrait"></canvas>
<script src="vendor/pixi.min.js"></script><script src="vendor/live2dcubismcore.min.js"></script><script src="vendor/pixi-live2d-display-cubism4.min.js"></script>
<script src="companion.js"></script>
<script>
window.asterReady=false;window.asterError='';window.asterStage='initializing';
window.asterLoading={requested:0,loaded:0,rig:false,textures:[],warnings:[]};
window.addEventListener('error',event=>{window.asterError=event.message||'Renderer resource failed';});
window.addEventListener('unhandledrejection',event=>{window.asterError=String(event.reason||'Renderer promise failed');});
(async()=>{
 const W=420,H=620,canvas=document.getElementById('portrait');
 const app=new PIXI.Application({view:canvas,width:W,height:H,backgroundColor:0x111318,antialias:true,preserveDrawingBuffer:true,autoStart:false});
 window.asterStage='reading renderer settings';
 const settings=await fetch('settings.json').then(r=>{if(!r.ok)throw Error('Renderer settings unavailable');return r.json()});
 const profile=AsterCompanion.validateProfile(settings.profile);
 const textureLimit=Math.max(512,Math.min(4096,settings.texture_size||2048));
 const originalFromURL=PIXI.Texture.fromURL.bind(PIXI.Texture);
 PIXI.Texture.fromURL=async (url,options)=>{
  window.asterLoading.requested++;
  const texture=await originalFromURL(url,options);
  const source=texture.baseTexture.resource.source;
  const width=texture.baseTexture.width,height=texture.baseTexture.height;
  const ratio=Math.min(1,textureLimit/Math.max(width,height));
  let rendered=texture;
  if(ratio<1){
   try{
    const reduced=document.createElement('canvas');reduced.width=Math.round(width*ratio);reduced.height=Math.round(height*ratio);
    const context=reduced.getContext('2d');context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';
    context.drawImage(source,0,0,reduced.width,reduced.height);
    rendered=PIXI.Texture.from(reduced);
   }catch(error){window.asterLoading.warnings.push(String(error));rendered=texture;}
   if(rendered!==texture){try{texture.destroy(true)}catch(error){window.asterLoading.warnings.push(String(error))}}
  }
  window.asterLoading.textures.push({file:String(url).split('/').pop(),original:[width,height],rendered:[rendered.baseTexture.width,rendered.baseTexture.height]});
  window.asterLoading.loaded++;
  return rendered;
 };
 window.asterStage='loading model and textures';
 let model;
 await new Promise((resolve,reject)=>{
  model=PIXI.live2d.Live2DModel.fromSync('model/'+encodeURIComponent(profile.model.split('/').pop()),{autoInteract:false,autoUpdate:false,onLoad:resolve,onError:reject});
  model.on('modelLoaded',()=>{window.asterLoading.rig=true});
 });
 window.asterStage='positioning model';
 app.stage.addChild(model);
 model.scale.set(1);model.position.set(0,0);
 const measured=model.getBounds();const raw={width:measured.width,height:measured.height};const scale=Math.min(W/raw.width,H/raw.height)*profile.layout.zoom;
 model.scale.set(scale);const box=model.getBounds();
 model.x+=W*profile.layout.center[0]-(box.x+box.width*profile.layout.anchor[0]);model.y+=H*profile.layout.center[1]-(box.y+box.height*profile.layout.anchor[1]);
 const engine=AsterCompanion.create(model.internalModel.coreModel,profile);
 window.asterCompanion=engine;
 let dt=100,frame=0,legacyMood='neutral';
 model.internalModel.on('beforeModelUpdate',()=>engine.apply(dt));
 window.asterFrame=(next={},delta=100)=>{
  dt=Math.max(0,Math.min(250,delta));
  engine.state(next.state||'idle');
  const results=[];
  const call=(id,action)=>{try{results.push({id,ok:true,result:action()})}catch(error){results.push({id,ok:false,error:String(error.message||error)})}};
  if(next.mood && next.mood!==legacyMood){call('mood',()=>engine.emotion(next.mood,1));legacyMood=next.mood;}
  if(next.tap)call('tap',()=>engine.motion('nod',1));
  if(next.look)call('look',()=>engine.look(-.25,0,2000));
  for(const item of (next.commands||[]).slice(0,32))call(item.id,()=>engine.dispatch(item.command));
  model.update(dt);app.renderer.render(app.stage);frame++;
  return {png:canvas.toDataURL('image/png').split(',')[1],frame,control:engine.snapshot(),results};
 };
 window.asterInfo={model:profile.name,api:engine.describe(),renderer:'Live2D Cubism + Pixi',textures:model.textures.length,texture_limit:textureLimit,texture_sizes:window.asterLoading.textures,texture_warnings:window.asterLoading.warnings,width:W,height:H,raw:{width:raw.width,height:raw.height}};
 window.asterFrame({state:'idle'});window.asterReady=true;window.asterStage='ready';
})().catch(e=>{window.asterError=String(e&&e.message||e)});
</script>
